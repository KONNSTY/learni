name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: PostgreSQL für RLS-Tests
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client
      - run: pip install -e 'apps/api[dev]'
      - run: ruff check apps/api
      - run: pytest apps/api -q
        env: { PYTHONPATH: apps/api }
      - run: pip-audit -r <(pip freeze --exclude-editable | grep -iE '^(fastapi|starlette|uvicorn|httpx|pydantic|pyjwt|jsonschema|pyyaml)==') --no-deps
      - run: python scripts/import_content.py validate
        env: { PYTHONPATH: apps/api }
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/gen-tokens.mjs --check
      - run: npx expo export --platform ios --output-dir /tmp/export
        env: { CI: "1", EXPO_OFFLINE: "1" }
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run check
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
