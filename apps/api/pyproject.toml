[project]
name = "learni-api"
version = "1.0.0"
description = "Learni Orchestrator API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyjwt>=2.7",
  "jsonschema>=4.21",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pip-audit>=2.7", "psycopg[binary]>=3.1"]
redis = ["redis>=5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 170
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608", "S108", "S603", "S103", "S607"]

[tool.setuptools.packages.find]
include = ["learni_api*"]
